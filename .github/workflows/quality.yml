name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s runner/tests -p 'test_*.py' -v

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Run complete Worker suite
        id: worker_tests
        shell: bash
        run: |
          set -o pipefail
          log_file="${RUNNER_TEMP}/worker-tests.log"
          if npm test --prefix worker >"$log_file" 2>&1; then
            tail -n 20 "$log_file"
          else
            echo "Worker suite failed. Showing the final diagnostic lines:"
            tail -n 180 "$log_file"
            exit 1
          fi
      - name: Upload Worker failure diagnostics
        if: ${{ failure() && steps.worker_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-test-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/worker-tests.log
          if-no-files-found: error
          retention-days: 3
      - name: Test deployment safety tooling
        id: deployment_tooling
        shell: bash
        run: |
          set -o pipefail
          log_file="${RUNNER_TEMP}/deployment-tooling-tests.log"
          if node --test tools/*.test.mjs >"$log_file" 2>&1; then
            tail -n 30 "$log_file"
          else
            echo "Deployment tooling tests failed. Showing the final diagnostic lines:"
            tail -n 220 "$log_file"
            exit 1
          fi
      - name: Inspect current production authentication state
        run: node tools/live-auth-audit.mjs
      - name: Upload deployment tooling failure diagnostics
        if: ${{ failure() && steps.deployment_tooling.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-tooling-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/deployment-tooling-tests.log
          if-no-files-found: error
          retention-days: 3

  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - run: npm test --prefix admin
