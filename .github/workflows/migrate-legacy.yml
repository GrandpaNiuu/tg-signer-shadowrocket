name: Migrate Legacy Telegram Configuration

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply encrypted import (off = safe presence-only dry run)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: telegram-checkin-legacy-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_URL: ${{ secrets.WORKER_URL || vars.WORKER_URL || secrets.CHECKIN_WORKER_URL || vars.CHECKIN_WORKER_URL }}
      WORKER_OIDC_AUDIENCE: ${{ secrets.WORKER_OIDC_AUDIENCE || vars.WORKER_OIDC_AUDIENCE || secrets.CHECKIN_WORKER_AUDIENCE || vars.CHECKIN_WORKER_AUDIENCE }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate migration control-plane identity
        run: |
          set -euo pipefail
          if [[ -z "${WORKER_URL:-}" ]]; then
            echo "::error::Configure WORKER_URL as a repository variable or secret."
            exit 1
          fi
          if [[ -z "${WORKER_OIDC_AUDIENCE:-}" ]]; then
            echo "::error::Configure WORKER_OIDC_AUDIENCE; it must exactly match the Worker RUNNER_OIDC_AUDIENCE."
            exit 1
          fi

      - name: Import legacy configuration
        env:
          APPLY: ${{ inputs.apply }}
          CHECKIN_TZ: ${{ vars.CHECKIN_TZ || 'Asia/Shanghai' }}
          SIGN_MODE: ${{ vars.SIGN_MODE || 'send-text' }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_TARGET_CHAT: ${{ secrets.TG_TARGET_CHAT }}
          TG_CHECKIN_TEXT: ${{ secrets.TG_CHECKIN_TEXT || '/checkin' }}
          TG_MESSAGE_THREAD_ID: ${{ secrets.TG_MESSAGE_THREAD_ID }}
          TG_SIGNER_TASK_NAME: ${{ secrets.TG_SIGNER_TASK_NAME }}
          TG_SIGNER_IMPORT_BASE64: ${{ secrets.TG_SIGNER_IMPORT_BASE64 }}
          TG_ACCOUNT: ${{ secrets.TG_ACCOUNT }}
          TG_PROXY: ${{ secrets.TG_PROXY }}
          CHECKIN_DELETE_AFTER: ${{ secrets.CHECKIN_DELETE_AFTER }}
          TG_SESSION_STRING_2: ${{ secrets.TG_SESSION_STRING_2 }}
          TG_API_ID_2: ${{ secrets.TG_API_ID_2 }}
          TG_API_HASH_2: ${{ secrets.TG_API_HASH_2 }}
          TG_TARGET_CHAT_2: ${{ secrets.TG_TARGET_CHAT_2 }}
          TG_CHECKIN_TEXT_2: ${{ secrets.TG_CHECKIN_TEXT_2 }}
          TG_MESSAGE_THREAD_ID_2: ${{ secrets.TG_MESSAGE_THREAD_ID_2 }}
          TG_SIGNER_TASK_NAME_2: ${{ secrets.TG_SIGNER_TASK_NAME_2 }}
          TG_SIGNER_IMPORT_BASE64_2: ${{ secrets.TG_SIGNER_IMPORT_BASE64_2 }}
          TG_ACCOUNT_2: ${{ secrets.TG_ACCOUNT_2 }}
          TG_PROXY_2: ${{ secrets.TG_PROXY_2 }}
          CHECKIN_DELETE_AFTER_2: ${{ secrets.CHECKIN_DELETE_AFTER_2 }}
          TELEGRAM_NOTIFY_BOT_TOKEN: ${{ secrets.TELEGRAM_NOTIFY_BOT_TOKEN }}
          TELEGRAM_NOTIFY_CHAT_ID: ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
        run: |
          set -euo pipefail
          if [[ "$APPLY" == "true" ]]; then
            python scripts/migrate_legacy.py --apply
          else
            python scripts/migrate_legacy.py
          fi

      - name: Record safe migration summary
        run: |
          if [[ "${{ inputs.apply }}" == "true" ]]; then
            echo "Legacy configuration was imported with scheduler activation disabled." >> "$GITHUB_STEP_SUMMARY"
            echo "Verify the imported accounts and tasks in the admin UI before switching scheduler_mode to d1." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run completed. No secret values were transmitted or stored." >> "$GITHUB_STEP_SUMMARY"
          fi
