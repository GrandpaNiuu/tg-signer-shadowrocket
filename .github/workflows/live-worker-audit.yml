name: Live Worker Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/live-worker-audit.yml"
      - "tools/live-worker-audit.mjs"
      - "tools/live-worker-audit.test.mjs"
      - "worker/src/app.js"
      - "worker/src/realtime-automation.js"
      - "worker/migrations/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/live-worker-audit.yml"
      - "tools/live-worker-audit.mjs"
      - "tools/live-worker-audit.test.mjs"
      - "worker/src/app.js"
      - "worker/src/realtime-automation.js"
      - "worker/migrations/**"
  schedule:
    - cron: "31 3 * * *"

permissions:
  contents: read

concurrency:
  group: live-worker-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_URL: ${{ vars.WORKER_URL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Test Worker audit contract
        run: node --test tools/live-worker-audit.test.mjs
      - name: Inspect production Worker readiness
        shell: bash
        run: |
          set -o pipefail
          node tools/live-worker-audit.mjs | tee "${RUNNER_TEMP}/live-worker-audit.log"
      - name: Upload sanitized Worker audit result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-worker-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/live-worker-audit.log
          if-no-files-found: error
          retention-days: 7
