name: Daily Telegram Checkin

on:
  schedule:
    # Runs daily at 00:00 Asia/Shanghai. GitHub Actions cron uses UTC.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "send-text or task"
        required: false
        default: "send-text"
      target_chat:
        description: "Target chat username or chat id"
        required: false
      checkin_text:
        description: "Text to send when mode=send-text"
        required: false
      task_name:
        description: "tg-signer task name when mode=task"
        required: false

permissions:
  contents: read

env:
  TZ: ${{ vars.CHECKIN_TZ || 'Asia/Shanghai' }}
  SIGN_MODE: ${{ vars.SIGN_MODE || 'send-text' }}
  TG_CHECKIN_TEXT: ${{ secrets.TG_CHECKIN_TEXT || '/checkin' }}

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Telegram configuration
        env:
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TG_TARGET_CHAT: ${{ secrets.TG_TARGET_CHAT }}
          TG_CHECKIN_TEXT_SECRET: ${{ secrets.TG_CHECKIN_TEXT }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_TARGET_CHAT: ${{ github.event.inputs.target_chat }}
          INPUT_CHECKIN_TEXT: ${{ github.event.inputs.checkin_text }}
          INPUT_TASK_NAME: ${{ github.event.inputs.task_name }}
          TG_SIGNER_TASK_NAME: ${{ secrets.TG_SIGNER_TASK_NAME }}
        run: |
          set -euo pipefail

          MODE="${INPUT_MODE:-}"
          if [ -z "$MODE" ]; then
            MODE="${SIGN_MODE:-send-text}"
          fi

          echo "Mode: $MODE"

          if [ -z "${TG_SESSION_STRING:-}" ]; then
            echo "::error title=Missing TG_SESSION_STRING::Add GitHub Secret TG_SESSION_STRING. This is required to log in to your Telegram user account."
            echo "Missing: TG_SESSION_STRING" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$MODE" = "send-text" ]; then
            TARGET_CHAT="${INPUT_TARGET_CHAT:-}"
            if [ -z "$TARGET_CHAT" ]; then
              TARGET_CHAT="${TG_TARGET_CHAT:-}"
            fi

            if [ -z "$TARGET_CHAT" ]; then
              echo "::error title=Missing target chat::Set TG_TARGET_CHAT secret or fill target_chat when running workflow manually. Example: @your_bot"
              echo "Missing: TG_TARGET_CHAT or workflow input target_chat" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            CHECKIN_TEXT="${INPUT_CHECKIN_TEXT:-}"
            if [ -z "$CHECKIN_TEXT" ]; then
              CHECKIN_TEXT="${TG_CHECKIN_TEXT_SECRET:-/checkin}"
            fi

            if [ -z "$CHECKIN_TEXT" ]; then
              echo "::error title=Missing checkin text::Set TG_CHECKIN_TEXT secret or fill checkin_text when running workflow manually."
              echo "Missing: TG_CHECKIN_TEXT or workflow input checkin_text" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "Telegram config check passed for send-text mode."
            echo "Target chat is configured. Checkin text is configured." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MODE" = "task" ]; then
            TASK_NAME="${INPUT_TASK_NAME:-}"
            if [ -z "$TASK_NAME" ]; then
              TASK_NAME="${TG_SIGNER_TASK_NAME:-}"
            fi

            if [ -z "$TASK_NAME" ]; then
              echo "::error title=Missing task name::Set TG_SIGNER_TASK_NAME secret or fill task_name when running workflow manually."
              echo "Missing: TG_SIGNER_TASK_NAME or workflow input task_name" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "Telegram config check passed for task mode."
          else
            echo "::error title=Unsupported mode::Allowed values are send-text or task."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tg-signer
        run: |
          python -m pip install --upgrade pip
          python -m pip uninstall -y tg-signer || true
          python -m pip install --upgrade "tg-signer[yaml] @ git+https://github.com/amchii/tg-signer.git"
          tg-signer version

      - name: Run checkin
        id: run_checkin
        env:
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TG_TARGET_CHAT: ${{ secrets.TG_TARGET_CHAT }}
          TG_MESSAGE_THREAD_ID: ${{ secrets.TG_MESSAGE_THREAD_ID }}
          TG_SIGNER_TASK_NAME: ${{ secrets.TG_SIGNER_TASK_NAME }}
          TG_SIGNER_IMPORT_BASE64: ${{ secrets.TG_SIGNER_IMPORT_BASE64 }}
          TG_ACCOUNT: ${{ secrets.TG_ACCOUNT }}
          TG_PROXY: ${{ secrets.TG_PROXY }}
          CHECKIN_DELETE_AFTER: ${{ secrets.CHECKIN_DELETE_AFTER }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_TARGET_CHAT: ${{ github.event.inputs.target_chat }}
          INPUT_CHECKIN_TEXT: ${{ github.event.inputs.checkin_text }}
          INPUT_TASK_NAME: ${{ github.event.inputs.task_name }}
        run: |
          set -o pipefail
          bash scripts/run_checkin.sh 2>&1 | tee run.log

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_NOTIFY_BOT_TOKEN: ${{ secrets.TELEGRAM_NOTIFY_BOT_TOKEN }}
          TELEGRAM_NOTIFY_CHAT_ID: ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
          CHECKIN_STATUS: ${{ job.status }}
          LOG_PATH: run.log
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/notify.py
