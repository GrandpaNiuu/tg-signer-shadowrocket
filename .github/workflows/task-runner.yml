name: Unified Telegram Task Runner

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Opaque D1 task run id
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: telegram-task-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_ID: ${{ inputs.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: runner/requirements.txt

      - name: Resolve Worker configuration
        id: resolve_worker
        uses: ./.github/actions/resolve-worker-config
        with:
          worker-url: ${{ secrets.WORKER_URL || vars.WORKER_URL }}
          worker-oidc-audience: ${{ secrets.WORKER_OIDC_AUDIENCE || vars.WORKER_OIDC_AUDIENCE }}

      - name: Validate task run id
        id: validate_id
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{7,159}$ ]] || {
            echo "Invalid run_id format."
            exit 1
          }

      - name: Install pinned Telegram dependency
        id: install_dependency
        run: python -m pip install --disable-pip-version-check --requirement runner/requirements.txt

      - name: Execute claimed task
        id: execute
        continue-on-error: true
        env:
          RESULT_FILE: ${{ runner.temp }}/telegram-runner-result.json
        run: >-
          python -m runner.cli run
          --run-id "$RUN_ID"
          --result-file "$RESULT_FILE"

      - name: Ensure terminal callback
        if: ${{ always() && steps.resolve_worker.outcome == 'success' && steps.validate_id.outcome == 'success' && steps.install_dependency.outcome == 'success' }}
        env:
          RESULT_FILE: ${{ runner.temp }}/telegram-runner-result.json
        run: >-
          python -m runner.cli finalize
          --run-id "$RUN_ID"
          --result-file "$RESULT_FILE"

      - name: Reflect task outcome in Actions
        if: ${{ always() && steps.resolve_worker.outcome == 'success' && steps.validate_id.outcome == 'success' && steps.install_dependency.outcome == 'success' }}
        env:
          RESULT_FILE: ${{ runner.temp }}/telegram-runner-result.json
        run: python -m runner.cli assert-success --result-file "$RESULT_FILE"
