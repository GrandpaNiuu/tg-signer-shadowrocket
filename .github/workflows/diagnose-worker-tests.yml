name: Diagnose Worker Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-worker-tests.yml"
      - "worker/**"

permissions:
  contents: read

concurrency:
  group: diagnose-telegram-worker-tests
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Capture Worker test output
        id: worker_tests
        shell: bash
        run: |
          set +e
          npm test --prefix worker > worker-test.log 2>&1
          status=$?
          echo "$status" > worker-test-status.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Worker test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-test-report
          path: |
            worker-test.log
            worker-test-status.txt
          if-no-files-found: error
          retention-days: 3
      - name: Fail when Worker tests fail
        if: steps.worker_tests.outputs.status != '0'
        run: |
          tail -n 160 worker-test.log
          exit 1
