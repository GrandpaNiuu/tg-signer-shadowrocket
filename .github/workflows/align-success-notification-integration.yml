name: Align successful notification integration test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/align-success-notification-integration.yml"

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Update successful notification assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("worker/test/api-integration.test.js")
          text = path.read_text(encoding="utf-8")
          old = '''  assert.match(telegramMessages[0].body.text, /任务执行成功/);
            assert.match(telegramMessages[0].body.text, /用户：<\\/b>GrandpaNiuu/);
            assert.doesNotMatch(telegramMessages[0].body.text, /GitHub Actions|check-in done/);
            assert.deepEqual(telegramMessages[0].body.reply_markup, {
              inline_keyboard: [[{
                text: "查看执行详情",
                url: "https://github.com/owner/repo/actions/runs/9001",
              }]],
            });'''
          new = '''  assert.match(telegramMessages[0].body.text, /任务执行成功/);
            assert.match(telegramMessages[0].body.text, /任务：<\\/b>/);
            assert.match(telegramMessages[0].body.text, /用户：<\\/b>GrandpaNiuu/);
            assert.match(telegramMessages[0].body.text, /耗时：<\\/b>/);
            assert.doesNotMatch(telegramMessages[0].body.text, /账号：|方式：|GitHub Actions|check-in done|查看执行详情/);
            assert.equal(telegramMessages[0].body.reply_markup, undefined);'''
          if old not in text:
              raise SystemExit("Expected successful notification assertion block was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit aligned integration test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/test/api-integration.test.js
          git commit -m "test: align successful notification integration output"
          git push origin HEAD:main
