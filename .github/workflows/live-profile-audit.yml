name: Live Profile API Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/live-profile-audit.yml"
      - "admin/**"
      - "worker/src/profile-branding.js"
      - "worker/migrations/**"
      - "tools/live-profile-audit.mjs"
      - "tools/live-profile-audit.test.mjs"
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/live-profile-audit.yml"
      - "admin/**"
      - "worker/src/profile-branding.js"
      - "worker/migrations/**"
      - "tools/live-profile-audit.mjs"
      - "tools/live-profile-audit.test.mjs"
  schedule:
    - cron: "31 3 * * *"

permissions:
  contents: read

concurrency:
  group: live-profile-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_URL: https://grandpaniu.ccwu.cc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Test audit contract
        run: node --test tools/live-profile-audit.test.mjs
      - name: Inspect production profile routes
        shell: bash
        run: |
          set -o pipefail
          node tools/live-profile-audit.mjs | tee "${RUNNER_TEMP}/live-profile-audit.log"
      - name: Upload sanitized audit result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-profile-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/live-profile-audit.log
          if-no-files-found: warn
          retention-days: 7
