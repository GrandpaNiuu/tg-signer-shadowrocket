name: Split Worker smoke checks

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/split-worker-smoke-checks.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Replace combined smoke check
        run: python tools/split-worker-smoke-checks.py

      - name: Remove one-time maintenance files
        run: rm .github/workflows/split-worker-smoke-checks.yml tools/split-worker-smoke-checks.py

      - name: Commit smoke diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-worker.yml .github/workflows/split-worker-smoke-checks.yml tools/split-worker-smoke-checks.py
          git commit -m "ci: make Worker smoke failures directly diagnosable"
          git push origin HEAD:main
