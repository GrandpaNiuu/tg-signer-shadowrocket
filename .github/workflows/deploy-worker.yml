name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/deploy-worker.yml"
      - "worker/**"
      - "package.json"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub Secret: CLOUDFLARE_API_TOKEN"
            echo "Set it in: Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing GitHub Secret: CLOUDFLARE_ACCOUNT_ID"
            echo "Set it in: Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          echo "Cloudflare deployment secrets are present."

      - name: Normalize Cloudflare API token
        id: normalize_token
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys

          raw = os.environ.get("RAW_CLOUDFLARE_API_TOKEN", "")
          token = raw.strip().strip('"').strip("'")

          prefixes = [
              "Authorization: Bearer ",
              "authorization: bearer ",
              "Bearer ",
              "bearer ",
              "CLOUDFLARE_API_TOKEN=",
              "cloudflare_api_token=",
          ]
          changed = False
          for prefix in prefixes:
              if token.startswith(prefix):
                  token = token[len(prefix):].strip()
                  changed = True

          token = "".join(token.split())

          print("Cloudflare API token normalized:", changed)
          print("Cloudflare API token length after normalization:", len(token))
          print("Cloudflare API token looks like API token:", token.startswith("cfat_"))

          if not token:
              print("CLOUDFLARE_API_TOKEN is empty after normalization.")
              sys.exit(1)

          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"token={token}\n")
          PY

      - name: Validate Cloudflare account access
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.normalize_token.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          token = os.environ["CLOUDFLARE_API_TOKEN"].strip()
          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"].strip()

          print("Account ID length:", len(account_id))
          print("Account ID format looks hex:", bool(re.fullmatch(r"[0-9a-fA-F]{32}", account_id)))
          print("Token starts with Bearer prefix:", token.lower().startswith("bearer "))
          print("Token starts with Authorization prefix:", token.lower().startswith("authorization:"))
          print("Token looks like Cloudflare token:", token.startswith("cfat_"))

          if token.lower().startswith("bearer ") or token.lower().startswith("authorization:"):
              print("CLOUDFLARE_API_TOKEN must be the raw token only. Do not include 'Bearer' or 'Authorization:' prefixes.")
              sys.exit(1)

          if not re.fullmatch(r"[0-9a-fA-F]{32}", account_id):
              print("CLOUDFLARE_ACCOUNT_ID is invalid. It should be exactly 32 hexadecimal characters from Cloudflare Account ID.")
              sys.exit(1)

          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account_id}",
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  body = resp.read().decode("utf-8", "replace")
                  status = resp.status
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", "replace")
              print("Cloudflare account validation HTTP status:", exc.code)
              print("Cloudflare response body:")
              print(body)
              print("Fix CLOUDFLARE_API_TOKEN: create a new token using Developer Platform -> Workers Scripts -> Edit, and Account Settings -> Read, for the same Cloudflare account.")
              sys.exit(1)
          except Exception as exc:
              print("Cloudflare account validation request failed.")
              print(str(exc))
              sys.exit(1)

          data = json.loads(body)
          if not data.get("success"):
              print("Cloudflare account validation failed.")
              print(json.dumps(data, ensure_ascii=False, indent=2))
              print("Fix CLOUDFLARE_ACCOUNT_ID or recreate CLOUDFLARE_API_TOKEN for the same account.")
              sys.exit(1)

          result = data.get("result") or {}
          print("Cloudflare account validation passed:", result.get("name", "<unknown account>"))
          PY

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.normalize_token.outputs.token }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          command: deploy --config worker/wrangler.toml
