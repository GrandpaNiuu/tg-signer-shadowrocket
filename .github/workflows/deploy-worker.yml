name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/deploy-worker.yml"
      - "worker/**"

permissions:
  contents: read

concurrency:
  group: deploy-telegram-checkin-worker
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - run: python -m unittest discover -s runner/tests -p 'test_*.py' -v
      - run: npm test --prefix worker

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check required Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing GitHub Secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing GitHub Secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ "${#PASSWORD_PEPPER}" -lt 16 ]; then
            echo "Missing or invalid GitHub Secret: PASSWORD_PEPPER"
            exit 1
          fi
          echo "Cloudflare deployment secrets are present."

      - name: Normalize Cloudflare API token
        id: normalize_token
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys

          raw = os.environ.get("RAW_CLOUDFLARE_API_TOKEN", "")
          token = raw.strip().strip('"').strip("'")
          for prefix in [
              "Authorization: Bearer ",
              "authorization: bearer ",
              "Bearer ",
              "bearer ",
              "CLOUDFLARE_API_TOKEN=",
              "cloudflare_api_token=",
          ]:
              if token.startswith(prefix):
                  token = token[len(prefix):].strip()
          token = "".join(token.split())
          if not token:
              print("CLOUDFLARE_API_TOKEN is empty after normalization.")
              sys.exit(1)
          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"token={token}\n")
          PY

      - name: Verify D1 takeover before retiring legacy configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.normalize_token.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          audit_json="$(npx --yes wrangler@4.94.0 d1 execute DB --remote --config worker/wrangler.toml --json --command "SELECT (SELECT COUNT(*) FROM accounts) AS account_count, (SELECT COUNT(*) FROM accounts WHERE status = 'connected') AS connected_account_count, (SELECT COUNT(*) FROM accounts a WHERE a.status = 'connected' AND EXISTS (SELECT 1 FROM secret_values s WHERE s.owner_type = 'account' AND s.owner_id = a.id AND s.purpose = 'telegram_session')) AS connected_session_account_count, (SELECT COUNT(*) FROM tasks) AS task_count, (SELECT COUNT(*) FROM task_runs WHERE status = 'success') AS successful_run_count;")"
          AUDIT_JSON="$audit_json" node - <<'NODE'
          const payload = JSON.parse(process.env.AUDIT_JSON || "null");
          function findEvidence(value) {
            if (Array.isArray(value)) {
              for (const item of value) {
                const found = findEvidence(item);
                if (found) return found;
              }
              return null;
            }
            if (!value || typeof value !== "object") return null;
            if (Object.hasOwn(value, "account_count") && Object.hasOwn(value, "successful_run_count")) return value;
            for (const child of Object.values(value)) {
              const found = findEvidence(child);
              if (found) return found;
            }
            return null;
          }
          const evidence = findEvidence(payload);
          if (!evidence) throw new Error("D1 retirement audit did not return an inventory row.");
          const counts = Object.fromEntries(Object.entries(evidence).map(([key, value]) => [key, Number(value)]));
          if (counts.account_count < 1 || counts.connected_account_count < 1) {
            throw new Error("D1 retirement blocked: no connected migrated Telegram account.");
          }
          if (counts.connected_session_account_count !== counts.connected_account_count) {
            throw new Error("D1 retirement blocked: a connected account has no encrypted Session record.");
          }
          if (counts.task_count < 1 || counts.successful_run_count < 1) {
            throw new Error("D1 retirement blocked: no migrated task with a successful D1 Runner canary.");
          }
          console.log(`D1 takeover verified: ${counts.connected_account_count} connected account(s), ${counts.task_count} task(s), ${counts.successful_run_count} successful run(s).`);
          NODE

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ steps.normalize_token.outputs.token }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.94.0"
          command: d1 migrations apply DB --remote --config worker/wrangler.toml

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ steps.normalize_token.outputs.token }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.94.0"
          secrets: |
            PASSWORD_PEPPER
          command: deploy --config wrangler.toml
        env:
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
