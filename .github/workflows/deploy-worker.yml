name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/deploy-worker.yml"
      - "worker/**"
      - "package.json"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub Secret: CLOUDFLARE_API_TOKEN"
            echo "Set it in: Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing GitHub Secret: CLOUDFLARE_ACCOUNT_ID"
            echo "Set it in: Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          echo "Cloudflare deployment secrets are present."

      - name: Validate Cloudflare account access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          token = os.environ["CLOUDFLARE_API_TOKEN"].strip()
          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"].strip()

          print("Account ID length:", len(account_id))
          print("Account ID format looks hex:", bool(re.fullmatch(r"[0-9a-fA-F]{32}", account_id)))
          print("Token starts with Bearer prefix:", token.lower().startswith("bearer "))

          if token.lower().startswith("bearer "):
              print("CLOUDFLARE_API_TOKEN must be the raw token only. Do not include 'Bearer '.")
              sys.exit(1)

          if not re.fullmatch(r"[0-9a-fA-F]{32}", account_id):
              print("CLOUDFLARE_ACCOUNT_ID is invalid. It should be exactly 32 hexadecimal characters from Cloudflare Account ID.")
              sys.exit(1)

          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account_id}",
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  body = resp.read().decode("utf-8", "replace")
                  status = resp.status
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", "replace")
              print("Cloudflare account validation HTTP status:", exc.code)
              print("Cloudflare response body:")
              print(body)
              print("Fix CLOUDFLARE_ACCOUNT_ID, or recreate CLOUDFLARE_API_TOKEN for the same Cloudflare account with Workers edit permission.")
              sys.exit(1)
          except Exception as exc:
              print("Cloudflare account validation request failed.")
              print(str(exc))
              sys.exit(1)

          data = json.loads(body)
          if not data.get("success"):
              print("Cloudflare account validation failed.")
              print(json.dumps(data, ensure_ascii=False, indent=2))
              print("Fix CLOUDFLARE_ACCOUNT_ID or recreate CLOUDFLARE_API_TOKEN for the same account.")
              sys.exit(1)

          result = data.get("result") or {}
          print("Cloudflare account validation passed:", result.get("name", "<unknown account>"))
          PY

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          command: deploy --config worker/wrangler.toml
