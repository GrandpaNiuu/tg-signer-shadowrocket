name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: Deployment safety mode
        required: true
        default: fresh_install
        type: choice
        options:
          - bootstrap
          - fresh_install
          - legacy_takeover
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/deploy-worker.yml"
      - "worker/cloudflare-worker.js"
      - "worker/src/**"
      - "worker/migrations/**"
      - "worker/wrangler.toml"
      - "tools/d1-takeover-audit.mjs"
      - "tools/d1-takeover-audit.test.mjs"
      - "tools/deploy-workflow.test.mjs"

permissions:
  contents: read

concurrency:
  group: deploy-telegram-checkin-worker
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - run: python -m unittest discover -s runner/tests -p 'test_*.py' -v
      - run: npm test --prefix worker
      - run: node --test tools/*.test.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOYMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode || 'fresh_install' }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Validate deployment mode
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_MODE" in
            bootstrap|fresh_install|legacy_takeover) ;;
            *)
              echo "Unsupported deployment mode: $DEPLOYMENT_MODE"
              exit 1
              ;;
          esac
          echo "Worker deployment mode: $DEPLOYMENT_MODE"

      - name: Check required Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing GitHub Secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing GitHub Secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ "$DEPLOYMENT_MODE" != "bootstrap" ] && [ "${#PASSWORD_PEPPER}" -lt 16 ]; then
            echo "Missing or invalid GitHub Secret: PASSWORD_PEPPER"
            exit 1
          fi
          if [ "$DEPLOYMENT_MODE" = "bootstrap" ]; then
            echo "Bootstrap mode: application Worker secrets may be configured after the first deployment."
          else
            echo "Cloudflare deployment secrets are present."
          fi

      - name: Prepare secure deployment configuration
        id: email_auth
        env:
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          mode = os.environ["DEPLOYMENT_MODE"]
          source = pathlib.Path("worker/wrangler.toml")
          target = pathlib.Path("worker/wrangler.deploy.toml")
          text = source.read_text(encoding="utf-8")
          target.write_text(text, encoding="utf-8")

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          if mode == "bootstrap":
              with output.open("a", encoding="utf-8") as stream:
                  stream.write("configured=false\n")
              sys.exit(0)

          names = [
              "TURNSTILE_SITE_KEY",
              "TURNSTILE_SECRET_KEY",
              "RESEND_API_KEY",
              "AUTH_EMAIL_FROM",
          ]
          values = {name: os.environ.get(name, "").strip() for name in names}
          present = [name for name, value in values.items() if value]
          if present and len(present) != len(names):
              missing = [name for name in names if not values[name]]
              print("Verified email authentication is only partially configured.")
              print("Missing GitHub Variables/Secrets: " + ", ".join(missing))
              sys.exit(1)

          secrets = {"PASSWORD_PEPPER": os.environ["PASSWORD_PEPPER"]}
          configured = len(present) == len(names)
          if configured:
              for name in ("TURNSTILE_SITE_KEY", "AUTH_EMAIL_FROM"):
                  value = values[name]
                  if "\n" in value or "\r" in value or len(value) > 512:
                      print(f"Invalid GitHub Variable: {name}")
                      sys.exit(1)
              if len(values["TURNSTILE_SECRET_KEY"]) < 8 or len(values["RESEND_API_KEY"]) < 8:
                  print("TURNSTILE_SECRET_KEY and RESEND_API_KEY must be configured as non-empty GitHub Secrets.")
                  sys.exit(1)
              text += "\nTURNSTILE_SITE_KEY = " + json.dumps(values["TURNSTILE_SITE_KEY"], ensure_ascii=False) + "\n"
              text += "AUTH_EMAIL_FROM = " + json.dumps(values["AUTH_EMAIL_FROM"], ensure_ascii=False) + "\n"
              target.write_text(text, encoding="utf-8")
              secrets.update({
                  "TURNSTILE_SECRET_KEY": values["TURNSTILE_SECRET_KEY"],
                  "RESEND_API_KEY": values["RESEND_API_KEY"],
              })

          secret_file = pathlib.Path("worker/.deploy-secrets.json")
          secret_file.write_text(json.dumps(secrets, ensure_ascii=False), encoding="utf-8")
          secret_file.chmod(0o600)
          for value in secrets.values():
              print(f"::add-mask::{value}")
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"configured={'true' if configured else 'false'}\n")
          print("Verified email authentication: " + ("configured" if configured else "registration remains safely closed"))
          PY

      - name: Normalize Cloudflare API token
        id: normalize_token
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys

          raw = os.environ.get("RAW_CLOUDFLARE_API_TOKEN", "")
          token = raw.strip().strip('"').strip("'")
          for prefix in [
              "Authorization: Bearer ",
              "authorization: bearer ",
              "Bearer ",
              "bearer ",
              "CLOUDFLARE_API_TOKEN=",
              "cloudflare_api_token=",
          ]:
              if token.startswith(prefix):
                  token = token[len(prefix):].strip()
          token = "".join(token.split())
          if not token:
              print("CLOUDFLARE_API_TOKEN is empty after normalization.")
              sys.exit(1)
          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"token={token}\n")
          PY

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ steps.normalize_token.outputs.token }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.94.0"
          command: d1 migrations apply DB --remote --config worker/wrangler.toml

      - name: Verify legacy D1 takeover evidence
        if: ${{ env.DEPLOYMENT_MODE == 'legacy_takeover' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.normalize_token.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          audit_json="$(npx --yes wrangler@4.94.0 d1 execute DB --remote --config worker/wrangler.toml --json --command "SELECT (SELECT COUNT(*) FROM accounts) AS account_count, (SELECT COUNT(*) FROM accounts WHERE status = 'connected') AS connected_account_count, (SELECT COUNT(*) FROM accounts a WHERE a.status = 'connected' AND EXISTS (SELECT 1 FROM secret_values s WHERE s.owner_type = 'account' AND s.owner_id = a.id AND s.purpose = 'telegram_session')) AS connected_session_account_count, (SELECT COUNT(*) FROM tasks) AS task_count, (SELECT COUNT(*) FROM task_runs WHERE status = 'success') AS successful_run_count;")"
          printf '%s' "$audit_json" | node tools/d1-takeover-audit.mjs

      - name: Deploy Worker bootstrap
        if: ${{ env.DEPLOYMENT_MODE == 'bootstrap' }}
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ steps.normalize_token.outputs.token }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.94.0"
          command: deploy --config wrangler.deploy.toml

      - name: Deploy Worker with configured secrets
        if: ${{ env.DEPLOYMENT_MODE != 'bootstrap' }}
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ steps.normalize_token.outputs.token }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.94.0"
          command: deploy --config wrangler.deploy.toml --secrets-file .deploy-secrets.json

      - name: Smoke test deployed Worker
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          EMAIL_AUTH_CONFIGURED: ${{ steps.email_auth.outputs.configured }}
          EXPECTED_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          base_url="${WORKER_URL:-}"
          if [ -z "$base_url" ]; then
            audience="$(sed -n 's/^RUNNER_OIDC_AUDIENCE = "\(.*\)"$/\1/p' worker/wrangler.toml | head -n 1)"
            case "$audience" in
              https://*/api/runner) base_url="${audience%/api/runner}" ;;
              *)
                echo "WORKER_URL is missing and RUNNER_OIDC_AUDIENCE cannot be used as a fallback."
                exit 1
                ;;
            esac
            echo "WORKER_URL is not configured; using the Worker origin derived from RUNNER_OIDC_AUDIENCE."
          fi
          base_url="${base_url%/}"
          case "$base_url" in
            https://*) ;;
            *)
              echo "Worker smoke-test URL must use HTTPS."
              exit 1
              ;;
          esac

          check_endpoint() {
            endpoint="$1"
            body="$(curl --fail-with-body --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 20 "$base_url/$endpoint")"
            ENDPOINT="$endpoint" RESPONSE_BODY="$body" node - <<'NODE'
          const endpoint = process.env.ENDPOINT;
          let payload;
          try {
            payload = JSON.parse(process.env.RESPONSE_BODY || "null");
          } catch {
            throw new Error(`Worker /${endpoint} returned invalid JSON.`);
          }
          if (payload?.ok !== true) throw new Error(`Worker /${endpoint} is not healthy.`);
          console.log(`Worker /${endpoint} verified.`);
          NODE
          }

          check_endpoint health
          if [ "$DEPLOYMENT_MODE" != "bootstrap" ]; then
            check_endpoint ready
            auth_body="$(curl --fail-with-body --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 20 "$base_url/api/auth/config")"
            RESPONSE_BODY="$auth_body" node - <<'NODE'
          const payload = JSON.parse(process.env.RESPONSE_BODY || "null")?.data;
          if (!payload || payload.email_enabled !== true) {
            throw new Error("Worker email login configuration is unavailable.");
          }
          const configured = process.env.EMAIL_AUTH_CONFIGURED === "true";
          if (configured) {
            if (payload.registration_enabled !== true
              || payload.email_verification_required !== true
              || payload.password_reset_enabled !== true
              || payload.turnstile_site_key !== process.env.EXPECTED_TURNSTILE_SITE_KEY) {
              throw new Error("Verified email authentication smoke check failed.");
            }
            console.log("Verified email registration, Turnstile, and password recovery are enabled.");
          } else {
            if (payload.registration_enabled !== false || payload.password_reset_enabled !== false) {
              throw new Error("Unverified email registration was not safely closed.");
            }
            console.log("Email login remains available; unverified registration is safely closed.");
          }
          NODE
          else
            echo "Bootstrap deployment completed; configure Worker Secrets, then rerun fresh_install to require /ready."
          fi

      - name: Remove temporary deployment secrets
        if: always()
        run: rm -f worker/.deploy-secrets.json worker/wrangler.deploy.toml
