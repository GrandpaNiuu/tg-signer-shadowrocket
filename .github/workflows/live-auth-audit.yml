name: Live Authentication Audit

# Temporary production-asset diagnostic. Do not merge.
on:
  workflow_dispatch:
    inputs:
      require_email_registration:
        description: Fail when verified email registration is closed
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/live-auth-audit.yml"
      - "admin/**"
      - "worker/src/admin-auth.js"
      - "worker/src/email-auth.js"
      - "worker/src/public-auth-configuration.js"
      - "tools/live-auth-audit.mjs"
      - "tools/live-auth-audit.test.mjs"
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/live-auth-audit.yml"
      - "admin/**"
      - "worker/src/admin-auth.js"
      - "worker/src/email-auth.js"
      - "worker/src/public-auth-configuration.js"
      - "tools/live-auth-audit.mjs"
      - "tools/live-auth-audit.test.mjs"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: live-auth-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_URL: https://grandpaniu.ccwu.cc
      REQUIRE_EMAIL_REGISTRATION: ${{ github.event_name == 'workflow_dispatch' && inputs.require_email_registration || false }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Test audit contract
        run: node --test tools/live-auth-audit.test.mjs
      - name: Inspect production authentication state
        shell: bash
        run: |
          set -o pipefail
          node tools/live-auth-audit.mjs | tee "${RUNNER_TEMP}/live-auth-audit.log"
      - name: Upload sanitized audit result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-auth-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/live-auth-audit.log
          if-no-files-found: error
          retention-days: 7
