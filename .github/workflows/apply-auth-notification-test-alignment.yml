name: Apply auth and notification test alignment

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-auth-notification-test-alignment.yml"

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Update obsolete assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          integration = Path("worker/test/api-integration.test.js")
          text = integration.read_text(encoding="utf-8")
          replacements = {
              '  assert.match(telegramMessages[0].body.text, /测试通知/);': '''  assert.match(telegramMessages[0].body.text, /通知配置成功/);
            assert.match(telegramMessages[0].body.text, /所有用户的任务结果/);
            assert.equal(telegramMessages[0].body.parse_mode, "HTML");''',
              '''  assert.match(telegramMessages[0].body.text, /GitHub Actions：https:\/\/github\\.com\/owner\/repo\/actions\/runs\/9001/);
            assert.match(telegramMessages[0].body.text, /check-in done/);''': '''  assert.match(telegramMessages[0].body.text, /任务执行成功/);
            assert.match(telegramMessages[0].body.text, /用户：<\\/b>GrandpaNiuu/);
            assert.doesNotMatch(telegramMessages[0].body.text, /GitHub Actions|check-in done/);
            assert.deepEqual(telegramMessages[0].body.reply_markup, {
              inline_keyboard: [[{
                text: "查看执行详情",
                url: "https://github.com/owner/repo/actions/runs/9001",
              }]],
            });''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected integration assertion was not found: {old[:80]}")
              text = text.replace(old, new, 1)
          integration.write_text(text, encoding="utf-8")

          email_test = Path("worker/test/email-auth.test.js")
          text = email_test.read_text(encoding="utf-8")
          old = '  assert.equal((await mailMissing.json()).error.code, "email_auth_not_configured");'
          new = '  assert.equal((await mailMissing.json()).error.code, "secure_registration_not_configured");'
          if old not in text:
              raise SystemExit("Expected email auth error assertion was not found")
          email_test.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-auth-notification-test-alignment.yml

      - name: Commit aligned tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/test/api-integration.test.js worker/test/email-auth.test.js .github/workflows/apply-auth-notification-test-alignment.yml
          git commit -m "test: align integration coverage with secure auth and concise broadcasts"
          git push origin HEAD:main
