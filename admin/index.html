<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f3f6f9">
    <title>Telegram 自动消息</title>
    <link rel="stylesheet" href="/assets/styles.css?v=20260720-3">
    <link rel="stylesheet" href="/assets/premium-ui.css?v=20260721-4">
    <link rel="stylesheet" href="/assets/mobile-shell-v2.css?v=20260721-3">
    <link rel="stylesheet" href="/assets/profile-branding.css?v=20260721-2">
    <link rel="stylesheet" href="/assets/skill-expansion.css?v=20260722-3">
    <script type="module" src="/src/app.js?v=20260722-5"></script>
    <script type="module" src="/src/same-origin-write.js?v=20260721-1"></script>
    <script type="module" src="/src/account-login-only.js?v=20260721-1"></script>
    <script type="module" src="/src/auth-security.js?v=20260720-3"></script>
    <script type="module" src="/src/notification-guidance.js?v=20260720-3"></script>
    <script type="module" src="/src/skill-guidance.js?v=20260722-3"></script>
    <script type="module" src="/src/skill-expansion.js?v=20260722-6"></script>
    <script type="module" src="/src/realtime-automation.js?v=20260721-4"></script>
    <script type="module" src="/src/bot-inspection.js?v=20260721-1"></script>
    <script type="module" src="/src/automation-skill-hub.js?v=20260722-5"></script>
    <script type="module" src="/src/signer-skill-merge.js?v=20260722-4"></script>
    <script type="module" src="/src/task-entry-policy.js?v=20260721-1"></script>
    <script type="module" src="/src/platform-account-health.js?v=20260722-4"></script>
    <script type="module" src="/src/profile-branding.js?v=20260721-4"></script>
    <script type="module" src="/src/dashboard-title.js?v=20260722-2"></script>
    <script type="module" src="/src/profile-branding-status.js?v=20260721-4"></script>
    <script type="module" src="/src/mobile-shell-v2.js?v=20260721-4"></script>
  </head>
  <body>
    <section id="auth-gate" class="auth-gate" aria-labelledby="auth-title" hidden>
      <div class="auth-card">
        <span class="brand-mark auth-mark" aria-hidden="true">T</span>
        <p class="auth-eyebrow">消息与自动化工作台</p>
        <h1 id="auth-title">Telegram 自动消息</h1>
        <p id="auth-message">登录或注册后管理 Telegram 账号、定时消息与机器人命令。</p>
        <div id="auth-content" aria-live="polite"></div>
        <small>验证码和密码不会写入浏览器本地存储；登录成功后生成的 Telegram Session 仅在服务端加密保存。</small>
      </div>
    </section>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div id="app" class="app-shell" hidden>
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#/dashboard" aria-label="Telegram 自动消息首页">
          <span class="brand-mark" aria-hidden="true">T</span>
          <span>
            <strong>Telegram</strong>
            <small>消息与自动化</small>
          </span>
        </a>

        <nav class="nav-list">
          <a href="#/dashboard" data-route="dashboard"><span aria-hidden="true">⌂</span>概览</a>
          <a href="#/accounts" data-route="accounts"><span aria-hidden="true">◎</span>Telegram 账号</a>
          <a href="#/tasks" data-route="tasks"><span aria-hidden="true">✓</span>自动消息</a>
          <a href="#/skills" data-route="skills"><span aria-hidden="true">◇</span>任务类型</a>
          <a href="#/runs" data-route="runs"><span aria-hidden="true">↻</span>执行记录</a>
          <a href="#/sessions" data-route="sessions"><span aria-hidden="true">▣</span>登录会话</a>
          <a href="#/users" data-route="users" data-admin-only hidden><span aria-hidden="true">♙</span>用户管理</a>
          <a href="#/settings" data-route="settings"><span aria-hidden="true">⚙</span>设置</a>
        </nav>

        <div class="sidebar-foot">
          <div class="security-note"><span aria-hidden="true">●</span> 加密会话</div>
          <p>每位用户数据相互隔离</p>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <button id="menu-toggle" class="icon-button mobile-only" type="button" aria-label="打开导航" aria-expanded="false">☰</button>
          <div id="breadcrumb" class="breadcrumb">概览</div>
          <div class="topbar-actions">
            <span id="api-status" class="api-status" data-status="loading"><i></i><span>连接中</span></span>
            <div class="identity" title="由 GitHub 认证">
              <span class="avatar" aria-hidden="true">A</span>
              <span><strong id="identity-name">管理员</strong><small id="identity-email">GitHub</small></span>
              <button id="logout-button" class="button small ghost" type="button">退出</button>
            </div>
          </div>
        </header>

        <main id="main-content" tabindex="-1">
          <div id="view" aria-live="polite"></div>
        </main>
      </div>

      <nav class="mobile-tabbar" aria-label="移动端主导航">
        <a href="#/dashboard" data-route="dashboard"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5"></path><path d="M5.5 9.5V21h13V9.5M9.5 21v-6h5v6"></path></svg><small>概览</small></a>
        <a href="#/accounts" data-route="accounts"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c.7-4.2 3-6.3 7-6.3s6.3 2.1 7 6.3"></path></svg><small>账号</small></a>
        <a href="#/tasks" data-route="tasks"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v12H9l-5 4V5Z"></path><path d="M12 8v6M9 11h6"></path></svg><small>消息</small></a>
        <a href="#/runs" data-route="runs"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.5"></path><path d="M4 4v4.5h4.5M12 7.5V12l3 2"></path></svg><small>记录</small></a>
        <a href="#/settings" data-route="settings"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h9M17 18h3"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="15" cy="18" r="2"></circle></svg><small>设置</small></a>
      </nav>
    </div>

    <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>
    <div id="modal-root"></div>
    <div id="drawer-root"></div>
    <noscript>此后台需要启用 JavaScript。</noscript>
  </body>
</html>
