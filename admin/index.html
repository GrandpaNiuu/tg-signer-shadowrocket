<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f5f7f4">
    <title>Telegram 自动签到</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <script type="module" src="/src/app.js"></script>
  </head>
  <body>
    <section id="auth-gate" class="auth-gate" aria-labelledby="auth-title" hidden>
      <div class="auth-card">
        <span class="brand-mark auth-mark" aria-hidden="true">T</span>
        <p class="auth-eyebrow">个人管理后台</p>
        <h1 id="auth-title">Telegram 自动签到</h1>
        <p id="auth-message">使用唯一管理员 GitHub 账号登录后管理签到任务。</p>
        <a class="button primary auth-button" href="/api/auth/github/start">使用 GitHub 登录</a>
        <small>仅允许已配置的管理员账号，不提供注册入口。</small>
      </div>
    </section>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div id="app" class="app-shell" hidden>
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#/dashboard" aria-label="Telegram 自动签到首页">
          <span class="brand-mark" aria-hidden="true">T</span>
          <span>
            <strong>Telegram</strong>
            <small>自动签到</small>
          </span>
        </a>

        <nav class="nav-list">
          <a href="#/dashboard" data-route="dashboard"><span aria-hidden="true">⌂</span>概览</a>
          <a href="#/accounts" data-route="accounts"><span aria-hidden="true">◎</span>Telegram 账号</a>
          <a href="#/tasks" data-route="tasks"><span aria-hidden="true">✓</span>签到任务</a>
          <a href="#/skills" data-route="skills"><span aria-hidden="true">◇</span>Skills</a>
          <a href="#/runs" data-route="runs"><span aria-hidden="true">↻</span>执行记录</a>
          <a href="#/settings" data-route="settings"><span aria-hidden="true">⚙</span>设置</a>
        </nav>

        <div class="sidebar-foot">
          <div class="security-note"><span aria-hidden="true">●</span> GitHub OAuth</div>
          <p>个人管理后台</p>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <button id="menu-toggle" class="icon-button mobile-only" type="button" aria-label="打开导航" aria-expanded="false">☰</button>
          <div id="breadcrumb" class="breadcrumb">概览</div>
          <div class="topbar-actions">
            <span id="api-status" class="api-status" data-status="loading"><i></i><span>连接中</span></span>
            <div class="identity" title="由 GitHub 认证">
              <span class="avatar" aria-hidden="true">A</span>
              <span><strong id="identity-name">管理员</strong><small id="identity-email">GitHub</small></span>
              <button id="logout-button" class="button small ghost" type="button">退出</button>
            </div>
          </div>
        </header>

        <main id="main-content" tabindex="-1">
          <div id="view" aria-live="polite"></div>
        </main>
      </div>
    </div>

    <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>
    <div id="modal-root"></div>
    <div id="drawer-root"></div>
    <noscript>此后台需要启用 JavaScript。</noscript>
  </body>
</html>
