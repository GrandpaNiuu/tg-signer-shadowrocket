name = "tg-signer-shadowrocket"
main = "cloudflare-worker.js"
compatibility_date = "2025-01-01"

# Runtime configuration is redeployed only after the secure authentication and
# beginner-friendly notification contracts pass the repository test suites.
# The Worker tick is minute-based; tasks may be dispatched ahead so the Runner
# can wait until the configured second.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "telegram-checkin"
database_id = "d4554956-d80f-486b-a7c3-6dec3ea62094"
migrations_dir = "migrations"

[vars]
GITHUB_OWNER = "GrandpaNiuu"
GITHUB_REPO = "Telegramautomaticcheck-in"
GITHUB_REF = "main"
TASK_RUNNER_WORKFLOW_FILE = "task-runner.yml"
LOGIN_WORKFLOW_FILE = "telegram-login.yml"
RUNNER_OIDC_AUDIENCE = "https://tg-signer-shadowrocket.q3j1h8.workers.dev/api/runner"
ADMIN_ORIGIN = "https://grandpaniu.ccwu.cc"
ADMIN_GITHUB_LOGIN = "GrandpaNiuu"
ADMIN_GITHUB_USER_ID = "225517310"
ADMIN_SESSION_TTL_SECONDS = "604800"
# Compatibility baseline for the current Workers Free deployment. Raising this
# value automatically rehashes active users after their next successful login;
# benchmark Worker CPU first because password hashing is CPU-bound.
PASSWORD_HASH_ITERATIONS = "100000"
# Production never allows immediate, unverified email registration. Existing
# password users may still sign in while Resend and Turnstile are being set up;
# new registration opens only when both verification services are configured.
PUBLIC_PASSWORD_AUTH_MODE = "secure"
SCHEDULE_DISPATCH_LEAD_SECONDS = "120"
