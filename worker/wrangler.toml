name = "tg-signer-shadowrocket"
main = "cloudflare-worker.js"
compatibility_date = "2025-01-01"

# Cloudflare Cron Triggers use UTC time.
# 15:59 UTC = 23:59 Beijing time.
[triggers]
crons = ["59 15 * * *"]

[vars]
GITHUB_OWNER = "GrandpaNiuu"
GITHUB_REPO = "tg-signer-shadowrocket"
GITHUB_WORKFLOW_FILE = "daily-checkin.yml"
GITHUB_REF = "main"