name = "tg-signer-shadowrocket"
main = "cloudflare-worker.js"
compatibility_date = "2025-01-01"

# The scheduler ticks every minute. LEGACY_CRON gates the old daily workflow
# while scheduler_mode remains "legacy", so the existing behavior is preserved.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "telegram-checkin"
database_id = "d4554956-d80f-486b-a7c3-6dec3ea62094"
migrations_dir = "migrations"

[vars]
GITHUB_OWNER = "GrandpaNiuu"
GITHUB_REPO = "Telegramautomaticcheck-in"
GITHUB_WORKFLOW_FILE = "daily-checkin.yml"
GITHUB_REF = "main"
TASK_RUNNER_WORKFLOW_FILE = "task-runner.yml"
LOGIN_WORKFLOW_FILE = "telegram-login.yml"
MIGRATION_WORKFLOW_FILE = "migrate-legacy.yml"
LEGACY_CRON = "0 16 * * *"
RUNNER_OIDC_AUDIENCE = "https://tg-signer-shadowrocket.q3j1h8.workers.dev/api/runner"
ADMIN_ORIGIN = "https://telegram-checkin-admin.pages.dev"
ADMIN_GITHUB_LOGIN = "GrandpaNiuu"
ADMIN_GITHUB_USER_ID = "225517310"
ADMIN_SESSION_TTL_SECONDS = "604800"
