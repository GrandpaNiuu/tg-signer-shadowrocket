name = "tg-signer-shadowrocket"
main = "cloudflare-worker.js"
compatibility_date = "2025-01-01"

# Cloudflare Cron Triggers use UTC time.
# 16:00 UTC = 00:00 Beijing time.
[triggers]
crons = ["0 16 * * *"]

[vars]
GITHUB_OWNER = "GrandpaNiuu"
GITHUB_REPO = "Telegramautomaticcheck-in"
GITHUB_WORKFLOW_FILE = "daily-checkin.yml"
GITHUB_REF = "main"
